global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"
  - job_name: springboot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - chat-app-1:8080

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187